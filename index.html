<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Antify Share – Send files with a QR code</title>
<style>
:root{--bg:#f3f6fb;--panel:#fff;--line:#dfe5ee;--tx:#14213d;--mut:#5d6b82;--ac:#2f5bff;--ac2:#0e9f6e;--bad:#d93a4f;--r:16px;box-sizing:border-box;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:22px 16px 64px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
h1{font-size:24px;margin:0;letter-spacing:-.02em}
h2{font-size:17px;margin:0 0 6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:0 1px 2px #14213d0d}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.choose{grid-template-columns:1fr}}
.big{text-align:left;padding:26px 20px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);cursor:pointer;font:inherit;color:var(--tx);box-shadow:0 1px 2px #14213d0d}
.big:hover{border-color:var(--ac)}
.big b{display:block;font-size:20px;margin-bottom:4px}
.big span{color:var(--mut)}
.big.send b{color:var(--ac)}.big.recv b{color:var(--ac2)}
button,.btn{font:inherit;color:var(--tx);background:#eef2f9;border:1px solid var(--line);padding:10px 16px;border-radius:12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--ac)}
button:focus-visible,input:focus-visible,.drop:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.primary:hover:not(:disabled){filter:brightness(1.07)}
.drop{border:2px dashed #b9c4d6;border-radius:var(--r);padding:26px 12px;text-align:center;color:var(--mut);cursor:pointer;background:#f9fbff}
.drop:hover,.drop.on{border-color:var(--ac);background:#eef2ff}
.drop b{color:var(--tx)}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.thumb{width:48px;height:48px;border-radius:10px;background:#e8edf6 center/cover;flex:none;display:grid;place-items:center;font-size:11px;color:var(--mut);overflow:hidden}
.thumb video{width:100%;height:100%;object-fit:cover}
.grow{flex:1;min-width:0}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sz{font-size:13px;color:var(--mut)}
.good{color:var(--ac2);font-weight:600}
.x{padding:4px 10px}
.opt{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:14px 0 4px;font-size:14px}
.opt label{display:flex;gap:8px;align-items:center}
input[type=range]{accent-color:var(--ac);width:130px}
input[type=checkbox]{accent-color:var(--ac);width:18px;height:18px}
.tot{display:flex;gap:20px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.tot div{font-size:12px;color:var(--mut)}
.tot b{display:block;font-size:19px;color:var(--tx)}
.tot .s b{color:var(--ac2)}
.stage{text-align:center}
.stage p{color:var(--mut);margin:4px auto 12px;max-width:440px}
#qrbox{background:#fff;border:1px solid var(--line);padding:14px;border-radius:16px;width:max-content;max-width:100%;margin:12px auto}
#qrbox img,#qrbox canvas{display:block;max-width:100%;height:auto!important}
video#cam{width:100%;max-width:420px;aspect-ratio:1;border-radius:16px;background:#000;object-fit:cover;margin:8px auto;display:block}
.bar{height:12px;background:#e8edf6;border-radius:99px;overflow:hidden;margin:10px 0 8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:99px;transition:width .12s linear}
.stats{display:flex;gap:18px;font-size:13px;color:var(--mut);flex-wrap:wrap;justify-content:center}
.stats b{color:var(--tx)}
.rx{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rx:last-child{border-bottom:0}
.rx .thumb{width:72px;height:72px}
.rx video.pv{width:100%;max-height:220px;border-radius:12px;background:#000;margin-top:8px}
.rx pre{margin:4px 0 0;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--mut);max-height:54px;overflow:hidden;white-space:pre-wrap;word-break:break-all}
a.dl{background:var(--ac2);color:#fff;border-radius:12px;padding:10px 16px;font-weight:600;text-decoration:none;white-space:nowrap}
.empty{color:var(--mut);margin:6px 0}
footer{text-align:center;margin-top:48px;padding-top:28px;border-top:1px solid var(--line);color:var(--mut);font-size:14px}
footer img{width:150px;height:auto;display:block;margin:0 auto 12px}
footer p{margin:0 0 4px}
footer a{color:var(--mut)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 16px;border-radius:12px;max-width:90vw;opacity:0;pointer-events:none;transition:.2s;z-index:9}
#toast.on{opacity:1}#toast.err{background:var(--bad)}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Antify Share</h1><button id="btnHome" hidden>Start over</button></header>

<section id="home" class="choose">
  <button class="big send" id="goSend"><b>Send files</b><span>Photos, videos, PDFs, text. This device shows a QR code.</span></button>
  <button class="big recv" id="goRecv"><b>Receive files</b><span>Scan the sender’s QR code with this device’s camera.</span></button>
</section>

<section id="sendPane" hidden>
  <div class="card">
    <h2>Choose what to send</h2>
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose files"><b>Drop files here</b> or tap to browse<br><span class="sz">Photos, videos, PDF, text</span></div>
    <input type="file" id="file" multiple hidden accept="image/*,video/*,application/pdf,text/plain,.txt,.pdf">
    <div id="list"><p class="empty">No files yet.</p></div>
    <div class="opt">
      <label><input type="checkbox" id="shrink" checked> Shrink photos</label>
      <label>Quality <input type="range" id="qual" min="0.1" max="1" step="0.05" value="0.8"> <span id="qv">0.80</span></label>
    </div>
    <div class="tot"><div>Before<b id="tBefore">0 B</b></div><div>After<b id="tAfter">0 B</b></div><div class="s">Saved<b id="tSaved">0%</b></div></div>
    <p style="margin:16px 0 0"><button class="primary" id="btnQR">Create QR code</button></p>
  </div>
</section>

<section id="stage" class="card stage" hidden>
  <h2 id="stTitle"></h2>
  <p id="stText"></p>
  <div id="qrbox" hidden></div>
  <video id="cam" hidden playsinline muted></video>
  <button class="primary" id="stBtn" hidden></button>
  <div id="prog" hidden>
    <div class="sz" id="progLbl"></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="progBar"></i></div>
    <div class="stats"><span><b id="pPct">0%</b></span><span><b id="pSpd">0 B/s</b></span><span><b id="pEta">–</b> left</span><span id="pBytes"></span></div>
  </div>
</section>

<section id="recvPane" class="card" hidden>
  <h2>Received files</h2>
  <div id="inbox"><p class="empty">Files sent to you will appear here.</p></div>
</section>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = b => { if (b < 1024) return Math.round(b) + ' B'; const u = ['KB','MB','GB']; let i = -1; do { b /= 1024; i++; } while (b >= 1024 && i < 2); return b.toFixed(b < 10 ? 2 : 1) + ' ' + u[i]; };
const fmtT = s => !isFinite(s) ? '–' : s < 60 ? Math.ceil(s) + 's' : Math.floor(s / 60) + 'm ' + Math.ceil(s % 60) + 's';
let toastT;
function toast(m, err) { const t = $('#toast'); t.textContent = m; t.className = 'on' + (err ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 3800); }

/* ---------- view control ---------- */
function show(mode) {
  $('#home').hidden = mode !== 'home';
  $('#sendPane').hidden = mode !== 'send';
  $('#recvPane').hidden = mode !== 'recv';
  $('#stage').hidden = mode !== 'recv';
  $('#btnHome').hidden = mode === 'home';
}
function setStage(o) {
  $('#stage').hidden = false;
  $('#stTitle').textContent = o.title || ''; $('#stText').textContent = o.text || '';
  $('#qrbox').hidden = !o.qr; $('#cam').hidden = !o.cam;
  const b = $('#stBtn'); b.hidden = !o.btn;
  if (o.btn) { b.textContent = o.btn[0]; b.onclick = o.btn[1]; }
  $('#stage').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ---------- image compression ---------- */
const EXT = { 'image/jpeg': 'jpg', 'image/webp': 'webp', 'image/png': 'png' };

/** Redraws an image on a canvas: downscale to maxWidth, re-encode at `quality`, strips EXIF/GPS. */
async function compressImage(file, quality = 0.8, maxWidth = 1920) {
  const bmp = await createImageBitmap(file);
  const sc = Math.min(1, maxWidth / bmp.width);
  const w = Math.max(1, Math.round(bmp.width * sc)), h = Math.max(1, Math.round(bmp.height * sc));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const mime = file.type === 'image/jpeg' ? 'image/jpeg' : 'image/webp';
  if (mime === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bmp, 0, 0, w, h); bmp.close && bmp.close();
  const blob = await new Promise(r => c.toBlob(r, mime, quality));
  if (!blob) throw new Error('Could not encode image');
  return { blob, name: file.name.replace(/\.[^.]+$/, '') + '.' + (EXT[blob.type] || 'jpg') };
}

const queue = [];
const isShrinkable = f => /^image\/(jpeg|png|webp)$/.test(f.type);
function totals() {
  const a = queue.reduce((s, i) => s + i.file.size, 0), b = queue.reduce((s, i) => s + i.out.size, 0);
  $('#tBefore').textContent = fmt(a); $('#tAfter').textContent = fmt(b);
  $('#tSaved').textContent = a ? Math.max(0, Math.round((1 - b / a) * 100)) + '%' : '0%';
}
function addFiles(files) {
  for (const f of files) {
    if (/^(image|video)\//.test(f.type) || f.type === 'application/pdf' || f.type.startsWith('text/') || /\.(pdf|txt)$/i.test(f.name)) addItem(f);
    else toast('Skipped ' + f.name + ': unsupported type', true);
  }
}
function addItem(file) {
  const it = { file, out: file, outName: file.name, shrink: isShrinkable(file), url: null, busy: Promise.resolve() };
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = '<div class="thumb"></div><div class="grow"><div class="name"></div><div class="sz"></div></div><button class="x" aria-label="Remove">✕</button>';
  const th = row.querySelector('.thumb'), sz = row.querySelector('.sz'), nm = row.querySelector('.name');
  nm.textContent = file.name; nm.title = file.name;
  const showSize = () => {
    const d = Math.round((1 - it.out.size / file.size) * 100);
    sz.innerHTML = it.out === file ? fmt(file.size) + (it.shrink ? '' : ' · sent as is') : fmt(file.size) + ' → <b>' + fmt(it.out.size) + '</b> <span class="good">' + (d >= 0 ? '−' + d : '+' + -d) + '%</span>';
    totals();
  };
  it.run = () => it.busy = (async () => {
    if (!it.shrink || !$('#shrink').checked) { it.out = file; it.outName = file.name; return showSize(); }
    try { const r = await compressImage(file, +$('#qual').value, 1920); it.out = r.blob; it.outName = r.name; }
    catch (e) { it.out = file; toast('Could not shrink ' + file.name, true); }
    showSize();
  })();
  if (file.type.startsWith('image/')) { it.url = URL.createObjectURL(file); th.style.backgroundImage = 'url(' + it.url + ')'; }
  else if (file.type.startsWith('video/')) { it.url = URL.createObjectURL(file); th.innerHTML = '<video muted preload="metadata" src="' + it.url + '#t=0.5"></video>'; }
  else th.textContent = /pdf/i.test(file.type + file.name) ? 'PDF' : 'TXT';
  row.querySelector('.x').onclick = () => { queue.splice(queue.indexOf(it), 1); row.remove(); it.url && URL.revokeObjectURL(it.url); if (!queue.length) $('#list').innerHTML = '<p class="empty">No files yet.</p>'; totals(); };
  if (!queue.length) $('#list').innerHTML = '';
  queue.push(it); $('#list').appendChild(row); it.run();
}
let qt; $('#qual').oninput = () => { $('#qv').textContent = (+$('#qual').value).toFixed(2); clearTimeout(qt); qt = setTimeout(() => queue.forEach(i => i.run()), 200); };
$('#shrink').onchange = () => queue.forEach(i => i.run());

/* ---------- WebRTC ---------- */
let pc = null, dc = null, role = null, sending = false, rx = null;
const MAXBUF = 4 << 20;

function initPeerConnection(r) {
  closePeer();
  role = r;
  pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  pc.onconnectionstatechange = () => { if (['failed', 'disconnected', 'closed'].includes(pc && pc.connectionState)) onDrop(); };
  if (r === 'host') setupChannel(pc.createDataChannel('files', { ordered: true }));
  else pc.ondatachannel = e => setupChannel(e.channel);
}
function setupChannel(ch) {
  dc = ch; ch.binaryType = 'arraybuffer'; ch.bufferedAmountLowThreshold = 1 << 20;
  ch.onopen = () => {
    stopScan(); toast('Connected');
    if (role === 'host') { setStage({ title: 'Connected. Sending…' }); sendAll(); }
    else setStage({ title: 'Connected', text: 'Waiting for the sender to start. Files will appear below.' });
  };
  ch.onclose = onDrop;
  ch.onerror = () => toast('Connection error', true);
  ch.onmessage = e => receiveChunkedFile(e.data);
}
function onDrop() {
  if (!pc) return;
  closePeer(); rx = null;
  setStage({ title: 'Connection lost', text: 'The other device disconnected. Start over to reconnect.', btn: ['Start over', reset] });
}
function closePeer() {
  const p = pc, d = dc; pc = dc = null;
  try { d && (d.onclose = null, d.close()); } catch {}
  try { p && (p.onconnectionstatechange = null, p.close()); } catch {}
}
const gather = () => new Promise(res => {
  if (pc.iceGatheringState === 'complete') return res();
  const t = setTimeout(res, 3000);
  pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); } });
});

/* SDP <-> QR text (IPv6 candidates dropped, deflate + base64) */
const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s); };
async function pack(sdp) {
  sdp = sdp.split('\r\n').filter(l => !(l.startsWith('a=candidate') && (l.split(' ')[4] || '').includes(':'))).join('\r\n');
  let bytes = new TextEncoder().encode(sdp), flag = '0';
  if (window.CompressionStream) { bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()); flag = '1'; }
  return 'PD' + flag + b64(bytes);
}
async function unpack(str) {
  if (!str.startsWith('PD')) throw new Error('not Antify Share');
  let bytes = Uint8Array.from(atob(str.slice(3)), c => c.charCodeAt(0));
  if (str[2] === '1') bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  return new TextDecoder().decode(bytes);
}
async function drawQR(sdp) {
  const code = await pack(sdp), box = $('#qrbox'); box.innerHTML = '';
  if (!window.QRCode) throw new Error('QR library failed to load. Check your internet connection and reload.');
  new QRCode(box, { text: code, width: 320, height: 320, correctLevel: QRCode.CorrectLevel.L });
}

/* ---------- QR scanning (BarcodeDetector, jsQR fallback) ---------- */
let camStream = null;
async function scanFor(cb) {
  try { camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); }
  catch { return toast('Camera blocked. Allow camera access (needs HTTPS or localhost).', true); }
  const v = $('#cam'); v.srcObject = camStream; await v.play();
  const det = 'BarcodeDetector' in window ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
  const tick = async () => {
    if (!camStream) return;
    let txt = null;
    try {
      if (det) { const r = await det.detect(v); txt = r[0] && r[0].rawValue; }
      else if (window.jsQR && v.videoWidth) {
        const k = Math.min(1, 640 / v.videoWidth); cv.width = v.videoWidth * k; cv.height = v.videoHeight * k;
        cx.drawImage(v, 0, 0, cv.width, cv.height);
        const d = cx.getImageData(0, 0, cv.width, cv.height), r = jsQR(d.data, d.width, d.height); txt = r && r.data;
      }
    } catch {}
    if (txt) { try { await cb(txt); return; } catch (e) { toast('That QR code isn’t from Antify Share', true); } }
    setTimeout(tick, 200);
  };
  tick();
}
function stopScan() { camStream && camStream.getTracks().forEach(t => t.stop()); camStream = null; $('#cam').hidden = true; }

/* ---------- pairing flows ---------- */
async function startSend() {
  if (!queue.length) return toast('Add at least one file first', true);
  try {
    setStage({ title: 'Creating QR code…' });
    await Promise.all(queue.map(i => i.busy));
    initPeerConnection('host');
    await pc.setLocalDescription(await pc.createOffer());
    await gather(); await drawQR(pc.localDescription.sdp);
    setStage({ title: 'Receiver: scan this QR code', text: 'On the other device, open Antify Share, tap Receive and point its camera here. When it shows its own QR code, tap Next.', qr: true,
      btn: ['Next: scan receiver’s QR', () => {
        setStage({ title: 'Scan the receiver’s QR code', text: 'Point this device’s camera at the QR code on the receiver’s screen.', cam: true });
        scanFor(async code => { const sdp = await unpack(code); stopScan(); await pc.setRemoteDescription({ type: 'answer', sdp }); setStage({ title: 'Connecting…' }); });
      }] });
  } catch (e) { toast(e.message, true); }
}
function startReceive() {
  setStage({ title: 'Scan the sender’s QR code', text: 'Point this device’s camera at the QR code on the sender’s screen.', cam: true });
  scanFor(async code => {
    const sdp = await unpack(code); stopScan();
    setStage({ title: 'Connecting…' });
    initPeerConnection('guest');
    await pc.setRemoteDescription({ type: 'offer', sdp });
    await pc.setLocalDescription(await pc.createAnswer());
    await gather(); await drawQR(pc.localDescription.sdp);
    setStage({ title: 'Show this QR code to the sender', text: 'The sender taps Next and scans this code. Transfer starts automatically.', qr: true });
  });
}
function reset() { stopScan(); closePeer(); rx = null; sending = false; $('#prog').hidden = true; $('#stage').hidden = true; show('home'); }

/* ---------- transfer ---------- */
function startProgress(label, total) {
  const t0 = performance.now(); let last = 0;
  $('#prog').hidden = false; $('#progLbl').textContent = label;
  return function update(done, force) {
    const now = performance.now(); if (!force && now - last < 80) return; last = now;
    const el = (now - t0) / 1000 || 0.001, spd = done / el, pct = total ? Math.round(done / total * 100) : 100;
    $('#progBar').style.width = pct + '%'; $('#progBar').parentElement.setAttribute('aria-valuenow', pct);
    $('#pPct').textContent = pct + '%'; $('#pSpd').textContent = fmt(spd) + '/s';
    $('#pEta').textContent = fmtT((total - done) / spd); $('#pBytes').textContent = fmt(done) + ' / ' + fmt(total);
  };
}

/** Streams a Blob over the data channel in 64 KB chunks with backpressure. */
async function sendChunkedFile({ blob, name }, idx, n) {
  const size = blob.size, id = crypto.randomUUID();
  const CH = Math.min(65536, (pc && pc.sctp && pc.sctp.maxMessageSize) || 65536);
  dc.send(JSON.stringify({ t: 'meta', id, name, type: blob.type || 'application/octet-stream', size }));
  const upd = startProgress('Sending ' + name + ' (' + (idx + 1) + ' of ' + n + ')', size);
  for (let off = 0; off < size; off += CH) {
    while (dc && dc.readyState === 'open' && dc.bufferedAmount > MAXBUF) await sleep(10);
    if (!dc || dc.readyState !== 'open') throw new Error('Connection lost while sending ' + name);
    dc.send(await blob.slice(off, off + CH).arrayBuffer());
    upd(Math.min(off + CH, size));
  }
  upd(size, true);
  dc.send(JSON.stringify({ t: 'end', id }));
}
async function sendAll() {
  if (sending || !dc) return; sending = true;
  try {
    const items = queue.slice();
    for (let i = 0; i < items.length; i++) await sendChunkedFile({ blob: items[i].out, name: items[i].outName }, i, items.length);
    setStage({ title: 'All files sent', text: 'You can close this page or start over to send more.', btn: ['Start over', reset] });
    toast('All files sent');
  } catch (e) { toast(e.message, true); }
  sending = false;
}

/** Handles control messages (string) and binary chunks (ArrayBuffer). */
function receiveChunkedFile(data) {
  try {
    if (typeof data === 'string') {
      const m = JSON.parse(data);
      if (m.t === 'meta') { setStage({ title: 'Receiving…' }); rx = { ...m, parts: [], got: 0, upd: startProgress('Receiving ' + m.name, m.size) }; }
      else if (m.t === 'end' && rx) { rx.upd(rx.size, true); finishReceive(rx); rx = null; }
      return;
    }
    if (!rx) return;
    rx.parts.push(data); rx.got += data.byteLength; rx.upd(rx.got);
  } catch (e) { toast('Receive error: ' + e.message, true); rx = null; }
}
async function finishReceive(f) {
  const blob = new Blob(f.parts, { type: f.type }), url = URL.createObjectURL(blob);
  if (!$('#inbox .rx')) $('#inbox').innerHTML = '';
  const el = document.createElement('div'); el.className = 'rx';
  el.innerHTML = '<div class="thumb"></div><div class="grow"><div class="name"></div><div class="sz"></div><pre hidden></pre></div><a class="dl">Download</a>';
  el.querySelector('.name').textContent = f.name;
  el.querySelector('.sz').textContent = fmt(blob.size);
  const a = el.querySelector('a'); a.href = url; a.download = f.name;
  const th = el.querySelector('.thumb');
  if (f.type.startsWith('image/')) th.style.backgroundImage = 'url(' + url + ')';
  else if (f.type.startsWith('video/')) {
    th.textContent = 'VIDEO';
    const v = document.createElement('video'); v.className = 'pv'; v.controls = true; v.playsInline = true; v.src = url;
    el.appendChild(v); v.style.flexBasis = '100%';
  }
  else if (f.type.startsWith('text/')) { th.textContent = 'TXT'; const p = el.querySelector('pre'); p.textContent = await blob.slice(0, 400).text(); p.hidden = false; }
  else { th.textContent = 'PDF'; const o = document.createElement('a'); o.href = url; o.target = '_blank'; o.rel = 'noopener'; o.className = 'sz'; o.textContent = 'Preview'; el.querySelector('.grow').appendChild(o); }
  $('#inbox').prepend(el); toast('Received ' + f.name);
  setStage({ title: 'Connected', text: 'Waiting for more files, if any.' });
}

/* ---------- wiring ---------- */
const drop = $('#drop'), fileIn = $('#file');
drop.onclick = () => fileIn.click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileIn.click(); } };
fileIn.onchange = () => { addFiles(fileIn.files); fileIn.value = ''; };
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('on'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('on'); }));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
$('#goSend').onclick = () => show('send');
$('#goRecv').onclick = () => { show('recv'); startReceive(); };
$('#btnQR').onclick = startSend;
$('#btnHome').onclick = reset;
window.addEventListener('beforeunload', () => { stopScan(); closePeer(); });
</script>
</body>
